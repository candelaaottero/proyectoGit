name: CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Incrementar versión en el README
        run: |
          CURRENT=$(grep -oP 'AppVersion-\K[0-9]+' README.md | tail -1)
          NEXT=$((CURRENT + 1))
          sed -i "s/AppVersion-$CURRENT/AppVersion-$NEXT/" README.md
          echo "Versión bump: $(date '+%Y-%m-%d %H:%M:%S')" >> README.md

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "cd: bump de versión" || echo "Sin cambios"
          git push

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if [ "$PROD_TOKEN" != "$LOCAL_PROD_TOKEN" ]; then
            echo "Token de producción no coincide"
            exit 1
          fi
          echo "Token válido"
